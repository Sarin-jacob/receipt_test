<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hybrid Receipt Parser (With Backend Selector & Warmup)</title>
  <style>
    :root { --bg: #0f172a; --card: #1e293b; --accent: #38bdf8; --text: #f8fafc; --muted: #94a3b8; }
    body { font-family: system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--text); max-width: 850px; margin: 2rem auto; padding: 0 1.5rem; }
    .card { background: var(--card); border: 1px solid #334155; border-radius: 12px; padding: 1.5rem; margin-bottom: 1.5rem; }
    .controls { display: flex; gap: 1rem; align-items: center; margin-bottom: 1rem; flex-wrap: wrap; }
    select, input[type="file"] { padding: 0.6rem; border: 1px solid #475569; border-radius: 6px; background: #0f172a; color: var(--text); }
    input[type="file"] { flex-grow: 1; border: 2px dashed #475569; cursor: pointer; }
    input[type="file"]:disabled, button:disabled { opacity: 0.5; cursor: not-allowed; }
    .status { margin-top: 10px; font-weight: 600; color: var(--accent); }
    pre { background: #020617; color: #38bdf8; padding: 1rem; border-radius: 8px; overflow-x: auto; font-size: 0.85rem; border: 1px solid #1e293b; max-height: 500px; }
    .metrics { display: flex; gap: 1rem; margin-top: 1rem; font-size: 0.85rem; color: var(--muted); }
    .metric-badge { background: #020617; padding: 0.4rem 0.8rem; border-radius: 6px; border: 1px solid #334155; }
  </style>
</head>
<body>

  <h2>Production-Ready Hybrid Receipt Parser</h2>
  <p style="color: var(--muted);">PaddleOCR + Qwen2.5-0.5B (With Explicit Warmup & Schema Enforcement)</p>

  <div class="card">
    <div class="controls">
      <label for="backendSelect"><strong>SLM Backend:</strong></label>
      <select id="backendSelect">
        <option value="webgpu">WebGPU (Fastest)</option>
        <option value="wasm">WASM CPU (Fallback)</option>
        <option value="webnn">WebNN (NPU)</option>
      </select>
      
      <button id="initBtn" style="padding: 0.6rem 1.2rem; background: #0284c7; color: white; border: none; border-radius: 6px; cursor: pointer;">
        Initialize Pipeline
      </button>
    </div>

    <input type="file" id="receiptInput" accept="image/*" disabled />
    <div id="status" class="status">Select backend and click Initialize Pipeline to begin...</div>
    
    <div class="metrics">
      <div class="metric-badge">OCR Time: <span id="ocrTime">0 ms</span></div>
      <div class="metric-badge">SLM Time: <span id="slmTime">0 ms</span></div>
    </div>
  </div>

  <div class="card">
    <h3>Extracted Structured JSON</h3>
    <pre id="output">Initialize models to proceed...</pre>
  </div>

  <script type="module">
    import { PaddleOCR } from 'https://cdn.jsdelivr.net/npm/@paddleocr/paddleocr-js@0.4.2/+esm';
    import { pipeline, env } from 'https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.0.0';

    // Configure WASM threads safely
    if (env.backends?.onnx?.wasm) {
      env.backends.onnx.wasm.numThreads = Math.min(4, navigator.hardwareConcurrency || 2);
    }

    const statusElem = document.getElementById('status');
    const outputElem = document.getElementById('output');
    const inputElem = document.getElementById('receiptInput');
    const initBtn = document.getElementById('initBtn');
    const backendSelect = document.getElementById('backendSelect');
    const ocrTimeElem = document.getElementById('ocrTime');
    const slmTimeElem = document.getElementById('slmTime');

    let ocrEngine;
    let slmPipeline;

    // -------------------------------------------------------------
    // INITIALIZATION & WARMUP
    // -------------------------------------------------------------
    initBtn.addEventListener('click', async () => {
      initBtn.disabled = true;
      backendSelect.disabled = true;
      const chosenBackend = backendSelect.value;

      try {
        // Step 1: Initialize PaddleOCR
        statusElem.textContent = '1/3: Loading PaddleOCR vision engine...';
        if (!ocrEngine) {
          ocrEngine = await PaddleOCR.create({
            lang: 'en',
            textDetectionModelName: 'PP-OCRv5_mobile_det',
            textRecognitionModelName: 'PP-OCRv5_mobile_rec'
          });
        }

        // Step 2: Initialize SLM (Qwen2.5-0.5B-Instruct for high JSON accuracy)
        statusElem.textContent = `2/3: Loading Qwen2.5-0.5B into [${chosenBackend.toUpperCase()}] backend...`;
        slmPipeline = await pipeline(
          'text-generation',
          'onnx-community/Qwen2.5-0.5B-Instruct',
          {
            device: chosenBackend,
            dtype: 'q4'
          }
        );

        // Step 3: WARMUP RUN (Pre-allocates buffers & compiles GPU shaders)
        statusElem.textContent = '3/3: Performing SLM Warmup Run (Compiling Shaders)...';
        const warmupStart = performance.now();
        
        await slmPipeline('<|im_start|>system\nYou are a helpful assistant.<|im_end|>\n<|im_start|>user\nHi<|im_end|>\n<|im_start|>assistant\n', {
          max_new_tokens: 1,
          do_sample: false
        });
        
        const warmupDuration = (performance.now() - warmupStart).toFixed(0);
        statusElem.textContent = `Pipeline Ready! (Warmup took ${warmupDuration} ms). Upload a receipt below.`;
        statusElem.style.color = '#4ade80';
        inputElem.disabled = false;

      } catch (err) {
        statusElem.textContent = `Initialization failed on ${chosenBackend}: ${err.message}. Try switching backend to WASM.`;
        statusElem.style.color = '#f87171';
        initBtn.disabled = false;
        backendSelect.disabled = false;
      }
    });

    // -------------------------------------------------------------
    // HELPER: Sort OCR Bounding Boxes into Natural Lines
    // -------------------------------------------------------------
    function extractSortedText(rawItems) {
      const items = rawItems.map(item => {
        let top = 0, left = 0;
        const pts = item.poly || item.points || item.box || [];
        if (Array.isArray(pts) && pts.length > 0) {
          top = Array.isArray(pts[0]) ? Math.min(...pts.map(p => p[1])) : pts[1];
          left = Array.isArray(pts[0]) ? Math.min(...pts.map(p => p[0])) : pts[0];
        }
        return { text: (item.text || '').trim(), top, left };
      }).filter(i => i.text.length > 0);

      items.sort((a, b) => a.top - b.top);

      const lines = [];
      items.forEach(item => {
        const lastLine = lines[lines.length - 1];
        if (lastLine && Math.abs(lastLine.y - item.top) < 12) {
          lastLine.items.push(item);
        } else {
          lines.push({ y: item.top, items: [item] });
        }
      });

      lines.forEach(line => line.items.sort((a, b) => a.left - b.left));
      return lines.map(l => l.items.map(i => i.text).join(' ')).join('\n');
    }

    // -------------------------------------------------------------
    // EXECUTION & FEW-SHOT JSON PROMPTING
    // -------------------------------------------------------------
    inputElem.addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file) return;

      outputElem.textContent = 'Stage 1: Running PaddleOCR...';
      
      try {
        // Stage 1: OCR
        const t0 = performance.now();
        const [ocrResults] = await ocrEngine.predict(file);
        const rawItems = ocrResults.items || ocrResults.words || [];
        const cleanText = extractSortedText(rawItems);
        const t1 = performance.now();
        ocrTimeElem.textContent = `${(t1 - t0).toFixed(0)} ms`;

        outputElem.textContent = 'Stage 2: SLM generating structured JSON...';

        // Stage 2: Few-Shot ChatML Prompting for Strict JSON
        const systemPrompt = `You are a strict JSON converter. Convert raw OCR text into valid JSON matching this schema:
{"enterprise":"string","date":"string","time":"string","items":[{"name":"string","quantity":1,"unit_price":0.0,"total_price":0.0}],"total":0.0}

Example Input:
COFFEE SHOP
10/05/2026 14:30
1 Espresso 3.50
TOTAL 3.50

Example Output:
{"enterprise":"COFFEE SHOP","date":"10/05/2026","time":"14:30","items":[{"name":"Espresso","quantity":1,"unit_price":3.50,"total_price":3.50}],"total":3.50}`;

        const prompt = `<|im_start|>system\n${systemPrompt}<|im_end|>\n<|im_start|>user\nConvert this OCR text to JSON:\n${cleanText}<|im_end|>\n<|im_start|>assistant\n`;

        const slmStart = performance.now();
        const output = await slmPipeline(prompt, {
          max_new_tokens: 350,
          temperature: 0.0, // Zero temperature forces deterministic JSON generation
          do_sample: false,
          return_full_text: false
        });
        const slmEnd = performance.now();
        slmTimeElem.textContent = `${(slmEnd - slmStart).toFixed(0)} ms`;

        const rawGenerated = output[0].generated_text.trim();
        
        // Strict JSON extraction
        const startIdx = rawGenerated.indexOf('{');
        const endIdx = rawGenerated.lastIndexOf('}');
        
        if (startIdx !== -1 && endIdx !== -1) {
          const jsonStr = rawGenerated.substring(startIdx, endIdx + 1);
          const parsed = JSON.parse(jsonStr);
          outputElem.textContent = JSON.stringify(parsed, null, 2);
        } else {
          outputElem.textContent = rawGenerated;
        }

      } catch (err) {
        outputElem.textContent = `Pipeline Error: ${err.message}\n${err.stack}`;
      }
    });
  </script>
</body>
</html>
