<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Receipt Review</title>
  <style>
    :root {
      --bg: #f6f7f9; --panel: #fff; --text: #16181d; --muted: #667085; --border: #e3e6eb;
      --yes: #12805c; --yes-bg: #e6f4ee; --no: #b42318; --no-bg: #fde8e7; --maybe: #a15c00; --maybe-bg: #fdf1df;
      --accent: #3557d6; --shade: rgba(10, 12, 16, .88);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #111317; --panel: #1a1d23; --text: #e8eaee; --muted: #9aa3b2; --border: #2c313a;
        --yes: #4cc38a; --yes-bg: #173326; --no: #f97066; --no-bg: #3b1a18; --maybe: #f0b44c; --maybe-bg: #3a2c12;
        --accent: #8aa4ff;
      }
    }
    * { box-sizing: border-box; }
    body { margin: 0; font: 14px/1.45 system-ui, -apple-system, Segoe UI, sans-serif; background: var(--bg); color: var(--text); }
    header { position: sticky; top: 0; z-index: 5; background: var(--panel); border-bottom: 1px solid var(--border); padding: 12px 16px; display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; }
    h1 { font-size: 17px; margin: 0; }
    .chips { display: flex; flex-wrap: wrap; gap: 6px; }
    .chip { border: 1px solid var(--border); background: var(--panel); color: var(--text); border-radius: 999px; padding: 4px 10px; font: inherit; font-size: 13px; cursor: pointer; }
    .chip[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); font-weight: 600; }
    .muted { color: var(--muted); font-size: 13px; }
    #save { margin-left: auto; }
    button.act { font: inherit; border-radius: 6px; padding: 6px 10px; border: 1px solid var(--border); background: var(--panel); color: var(--text); cursor: pointer; }
    main { padding: 16px; display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 12px; }
    .card { background: var(--panel); border: 2px solid var(--border); border-radius: 10px; padding: 8px; display: flex; flex-direction: column; gap: 6px; }
    .card[data-label="receipt"] { border-color: var(--yes); }
    .card[data-label="not"] { border-color: var(--no); opacity: .65; }
    .card[data-label="unsure"] { border-color: var(--maybe); }
    .card img { width: 100%; height: 230px; object-fit: contain; background: var(--border); border-radius: 6px; cursor: zoom-in; }
    .meta { font-size: 12px; color: var(--muted); word-break: break-all; }
    .btns { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 4px; }
    .btns button { font: inherit; font-size: 12px; padding: 5px 0; border-radius: 6px; border: 1px solid var(--border); background: var(--panel); color: var(--text); cursor: pointer; }
    .btns button.on[data-v="receipt"] { background: var(--yes-bg); color: var(--yes); border-color: var(--yes); font-weight: 600; }
    .btns button.on[data-v="not"] { background: var(--no-bg); color: var(--no); border-color: var(--no); font-weight: 600; }
    .btns button.on[data-v="unsure"] { background: var(--maybe-bg); color: var(--maybe); border-color: var(--maybe); font-weight: 600; }
    #focus { position: fixed; inset: 0; z-index: 10; background: var(--shade); display: none; flex-direction: column; align-items: center; justify-content: center; gap: 10px; padding: 12px; }
    #focus.open { display: flex; }
    #focus img { max-width: 100%; max-height: calc(100vh - 150px); object-fit: contain; border-radius: 6px; background: #000; }
    #focus .bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: center; color: #e8eaee; }
    #focus .bar button { font: inherit; padding: 8px 14px; border-radius: 8px; border: 1px solid #555; background: #22262e; color: #e8eaee; cursor: pointer; }
    #focus .bar button[data-v="receipt"] { border-color: #4cc38a; }
    #focus .bar button[data-v="not"] { border-color: #f97066; }
    #focus .bar button[data-v="unsure"] { border-color: #f0b44c; }
    #focus .bar button.on { background: #3557d6; border-color: #3557d6; }
    kbd { font: 12px ui-monospace, monospace; border: 1px solid #666; border-radius: 4px; padding: 0 4px; }
    @media (max-width: 600px) { main { grid-template-columns: repeat(2, 1fr); gap: 8px; padding: 8px; } .card img { height: 170px; } }
  </style>
</head>
<body>
  <header>
    <h1>Receipt review</h1>
    <div class="chips" id="filters"></div>
    <span class="muted" id="counts"></span>
    <span class="muted" id="save">loading…</span>
    <button class="act" id="start">Review unlabelled (fullscreen)</button>
    <button class="act" id="export">Export labels</button>
  </header>
  <main id="grid"></main>

  <div id="focus" role="dialog" aria-modal="true">
    <img id="fimg" alt="" />
    <div class="bar">
      <button data-v="receipt">Receipt / invoice <kbd>R</kbd></button>
      <button data-v="not">Not a receipt <kbd>N</kbd></button>
      <button data-v="unsure">Unsure <kbd>U</kbd></button>
      <button data-nav="-1">← prev</button>
      <button data-nav="1">next →</button>
      <button data-close>close <kbd>Esc</kbd></button>
    </div>
    <div class="bar" id="fmeta"></div>
  </div>

  <script>
    // Labels: { "<file>": "receipt" | "not" | "unsure" }.
    // Saved to web/labels.json when served by `python datasets/collect_web.py --serve`,
    // otherwise kept in this browser (localStorage) and exportable as a file.
    const LS = 'receipt-review-labels';
    const $ = id => document.getElementById(id);
    let images = [], labels = {}, filter = 'unlabelled', serverSave = false, focusIdx = -1, view = [];

    const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
    const localLoad = () => { try { return JSON.parse(localStorage.getItem(LS)) || {}; } catch { return {}; } };
    const localSave = () => { try { localStorage.setItem(LS, JSON.stringify(labels)); } catch {} };

    async function init() {
      const m = await (await fetch('web/manifest.json', { cache: 'no-store' })).json();
      images = m.images;
      let fileLabels = {};
      try {
        const r = await fetch('web/labels.json', { cache: 'no-store' });
        if (r.ok) fileLabels = await r.json();
      } catch {}
      labels = { ...localLoad(), ...fileLabels };
      try { serverSave = (await fetch('api/ping', { cache: 'no-store' })).ok; } catch {}
      $('save').textContent = serverSave ? 'saving to web/labels.json' : 'saved in this browser only (use Export)';
      render();
    }

    let saveTimer = null;
    function persist() {
      localSave();
      if (!serverSave) return;
      clearTimeout(saveTimer);
      $('save').textContent = 'saving…';
      saveTimer = setTimeout(async () => {
        try {
          const r = await fetch('api/labels', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(labels) });
          $('save').textContent = r.ok ? `saved ${new Date().toLocaleTimeString()}` : 'save failed (kept in browser)';
        } catch { $('save').textContent = 'save failed (kept in browser)'; }
      }, 300);
    }

    function setLabel(file, v) {
      if (labels[file] === v) delete labels[file]; else labels[file] = v;
      persist();
    }

    const FILTERS = [['unlabelled', 'Unlabelled'], ['all', 'All'], ['receipt', 'Receipts'], ['not', 'Not'], ['unsure', 'Unsure']];
    function visible() {
      return images.filter(i => filter === 'all' ? true : filter === 'unlabelled' ? !labels[i.file] : labels[i.file] === filter);
    }

    function render() {
      updateCounts();
      $('filters').innerHTML = FILTERS.map(([k, t]) => `<button class="chip" data-f="${k}" aria-pressed="${filter === k}">${t}</button>`).join('');
      view = visible();
      $('grid').innerHTML = view.map((i, n) => `
        <div class="card" data-file="${esc(i.file)}" data-label="${labels[i.file] || ''}">
          <img loading="lazy" src="web/${esc(i.file)}" data-n="${n}" alt="${esc(i.title || i.file)}" />
          <div class="btns">${['receipt', 'not', 'unsure'].map(v => `<button data-v="${v}" class="${labels[i.file] === v ? 'on' : ''}">${v === 'receipt' ? '✓ Receipt' : v === 'not' ? '✗ Not' : '? Unsure'}</button>`).join('')}</div>
          <div class="meta">${esc(i.category)} · ${i.width}×${i.height} · <a href="${esc(i.page_url)}" target="_blank" rel="noopener">${esc(i.source || 'source')}</a></div>
        </div>`).join('') || '<p class="muted">Nothing here.</p>';
    }

    $('filters').addEventListener('click', e => { const f = e.target.dataset.f; if (f) { filter = f; render(); } });
    $('grid').addEventListener('click', e => {
      const card = e.target.closest('.card');
      if (!card) return;
      if (e.target.dataset.v) {
        setLabel(card.dataset.file, e.target.dataset.v);
        // Stay put in the grid: update the card in place instead of re-filtering it away.
        card.dataset.label = labels[card.dataset.file] || '';
        card.querySelectorAll('.btns button').forEach(b => b.classList.toggle('on', labels[card.dataset.file] === b.dataset.v));
        updateCounts();
      } else if (e.target.tagName === 'IMG') openFocus(+e.target.dataset.n);
    });
    function updateCounts() {
      const c = { receipt: 0, not: 0, unsure: 0 };
      images.forEach(i => { if (labels[i.file]) c[labels[i.file]]++; });
      $('counts').textContent = `${images.length} images · ${c.receipt} receipts · ${c.not} not · ${c.unsure} unsure · ${images.length - c.receipt - c.not - c.unsure} left`;
    }

    // Fullscreen one-at-a-time review: R / N / U label and jump to the next.
    function openFocus(n) {
      if (!view.length) return;
      focusIdx = Math.max(0, Math.min(view.length - 1, n));
      const i = view[focusIdx];
      $('fimg').src = 'web/' + i.file;
      $('fmeta').innerHTML = `${focusIdx + 1} / ${view.length} · ${esc(i.category)} · ${esc(i.title || '')}`;
      document.querySelectorAll('#focus .bar button[data-v]').forEach(b => b.classList.toggle('on', labels[i.file] === b.dataset.v));
      $('focus').classList.add('open');
    }
    function closeFocus() { $('focus').classList.remove('open'); render(); }
    function labelFocused(v) {
      const i = view[focusIdx];
      setLabel(i.file, v);
      updateCounts();
      if (focusIdx < view.length - 1) openFocus(focusIdx + 1); else closeFocus();
    }
    $('focus').addEventListener('click', e => {
      const b = e.target.closest('button');
      if (!b) { if (e.target.id === 'focus') closeFocus(); return; }
      if (b.dataset.v) labelFocused(b.dataset.v);
      else if (b.dataset.nav) openFocus(focusIdx + +b.dataset.nav);
      else if ('close' in b.dataset) closeFocus();
    });
    document.addEventListener('keydown', e => {
      if (!$('focus').classList.contains('open')) return;
      const k = e.key.toLowerCase();
      if (k === 'r' || k === '1') labelFocused('receipt');
      else if (k === 'n' || k === '2') labelFocused('not');
      else if (k === 'u' || k === '3') labelFocused('unsure');
      else if (k === 'arrowright') openFocus(focusIdx + 1);
      else if (k === 'arrowleft') openFocus(focusIdx - 1);
      else if (k === 'escape') closeFocus();
      else return;
      e.preventDefault();
    });
    $('start').addEventListener('click', () => { filter = 'unlabelled'; render(); openFocus(0); });
    $('export').addEventListener('click', () => {
      const a = Object.assign(document.createElement('a'), { href: URL.createObjectURL(new Blob([JSON.stringify(labels, null, 1)], { type: 'application/json' })), download: 'labels.json' });
      a.click();
    });

    init().catch(err => { $('save').textContent = 'failed to load web/manifest.json: ' + err.message; });
  </script>
</body>
</html>
